<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reak Mod - Key Verification</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
            text-align: center;
            width: 85%;
            max-width: 350px;
            border: 1px solid #ff0000;
        }
        h2 { color: #ff3333; margin-bottom: 20px; }
        input[type="text"] {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            text-align: center;
            font-size: 16px;
        }
        button {
            width: 95%;
            padding: 12px;
            background: #ff0000;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #cc0000; }
        #error-msg { color: #ff4d4d; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Reak Mod</h2>
    <p>សូមបញ្ចូល Key ដើម្បីប្រើប្រាស់ App</p>
    <input type="text" id="keyInput" placeholder="Enter Key Here...">
    <button onclick="checkKey()">Unlock App</button>
    <p id="error-msg">❌ Key មិនត្រឹមត្រូវទេ!</p>
</div>

<script>
    function checkKey() {
        var userKey = document.getElementById("keyInput").value;
        // លេខកូដដែលអ្នកកំណត់
        var correctKey = "Chub ban chub tv";
        
        if (userKey === correctKey) {
            alert("✅ Key ត្រឹមត្រូវ! កំពុងចូល...");
            // ដាក់ Link Web ឬ Link Sensi របស់អ្នកត្រង់នេះ
            window.location.href = "https://google.com";
        } else {
            document.getElementById("error-msg").style.display = "block";
        }
    }
</script>

</body>
</html>
